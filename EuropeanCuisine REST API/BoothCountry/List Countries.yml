info:
  name: List Countries
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}?locale=fr"
  params:
    - name: locale
      value: fr
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
